<table style="border-collapse: collapse; width: 100%; font-family: sans-serif;">
  <thead>
    <tr style="background-color: #f2f2f2;">
      <th style="border: 1px solid #000; padding: 8px; text-align: left;">ID</th>
      <th style="border: 1px solid #000; padding: 8px; text-align: left;">Apellido</th>
      <th style="border: 1px solid #000; padding: 8px; text-align: left;">Especialidad</th>
      <th style="border: 1px solid #000; padding: 8px; text-align: left;">Salario</th>
      <th style="border: 1px solid #000; padding: 8px; text-align: left;">Hospital</th>
    </tr>
  </thead>
  <tbody>
    @for (doctor of arraydoctores; track doctor) {
      <tr>
        <td style="border: 1px solid #000; padding: 8px;">{{doctor.idDoctor}}</td>
        <td style="border: 1px solid #000; padding: 8px;">{{doctor.apellido}}</td>
        <td style="border: 1px solid #000; padding: 8px;">{{doctor.especialidad}}</td>
        <td style="border: 1px solid #000; padding: 8px;">{{doctor.salario}}</td>
        <td style="border: 1px solid #000; padding: 8px;">{{doctor.idHospital}}</td>
      </tr>
    }
  </tbody>
</table>
